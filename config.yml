# Parameter space for the design engine. A [min, max] list is sampled uniformly
# per design; a scalar is used as-is.
models:
  csym:
    num_texture_types: 4
    parameters:
      num_points: 250
      radius_offset: 0.7
      radius: [30, 50]
      height: [80, 100]
      phi_amplitude: [0, 0.3]
      phi_frequency: [0, 100]
      phi_duty_cycle: [0, 1]
      z_amplitude: [0, 0.1]
      z_frequency: [0, 10]
      z_duty_cycle: [0, 1]
      twist: [-2, 2]
      edginess: [0, 5]
      # fraction of height the axis may wander sideways
      tilt_x: [-0.5, 0.5]
      tilt_y: [-0.5, 0.5]

  rsym:
    num_texture_types: 4
    parameters:
      num_points: 250
      r_ratio: [0.2, 0.9]
      x_scaler: [1, 3]
      y_scaler: [1, 3]
      z_scaler: [1, 4]
      phi_amplitude: [0, 1]
      phi_frequency: [0, 20]
      phi_duty_cycle: [0, 1]
      theta_amplitude: [0, 1]
      theta_frequency: [0, 20]
      theta_duty_cycle: [0, 1]
      e1_twist: [-2, 2]
      e2_twist: [-2, 2]
      e3_twist: [-2, 2]

# Exported meshes are scaled uniformly so the bounding-box height equals
# target_height_mm, then scaled down further if the xy footprint exceeds
# max_footprint_mm (180 fits every Bambu bed incl. A1 mini).
print:
  target_height_mm: 100
  max_footprint_mm: 180
  min_radius_mm: 1.0

app:
  host: 0.0.0.0
  port: 8000
  # Grid resolution used for the browser preview; export uses models.*.num_points.
  preview_points: 120
  figure:
    height: 800
    margin: {t: 0, b: 0, l: 0, r: 0}
    color: "#b1b1b1"
    lighting:
      ambient: 0.1
      diffuse: 1
      fresnel: 0.1
      specular: 0.2
      roughness: 0.1
      facenormalsepsilon: 0
    lightposition: {x: 500, y: 500, z: 500}
  linkedin: "https://www.linkedin.com/in/daniel-hauser-77259a159"
